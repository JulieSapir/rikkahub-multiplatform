name: Linux Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
          key: linux-gradle-${{ hashFiles('gradle/**', 'linux/*.gradle.kts', 'linux/gradle/**') }}
      - name: Test and build Linux application
        run: ./gradlew -p linux test createDistributable --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-test-results
          path: linux/build/reports/tests/test
